name: CFAPEX CI/CD

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '是否先同步上游 shitouxiaoge-commits/CFAPEX'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      deploy_worker:
        description: '是否部署 Worker 到 Cloudflare'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: shitouxiaoge-commits/CFAPEX
  UPSTREAM_BRANCH: main
  WRANGLER_CONFIG: wrangler.cfapex.toml
  WORKER_FILE: CFAPEX-main/CFAPEX-worker.1.4.js

jobs:
  sync-upstream:
    if: github.event.inputs.sync_upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git

      - name: Fetch upstream
        run: git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Merge upstream into main
        run: |
          git checkout main
          git merge --no-edit upstream/${{ env.UPSTREAM_BRANCH }} || true

      - name: Push merged changes
        run: git push origin main

  deploy:
    needs: sync-upstream
    if: always() && github.event.inputs.deploy_worker == 'true' && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Create CFAPEX KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_GMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_GMAIL }}
        run: |
          nsid=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[]? | select(.title=="cfapex_config") | .id' | head -n1)
          if [ "$nsid" = "" ] || [ "$nsid" = "null" ]; then
            nsid=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"cfapex_config"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result.id')
          fi
          cp wrangler.cfapex.toml wrangler.cfapex.toml.generated
          sed -i "s/00000000000000000000000000000000/$nsid/" wrangler.cfapex.toml.generated
          echo "WRANGLER_CONFIG=wrangler.cfapex.toml.generated" >> $GITHUB_ENV
      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_GMAIL }}
        run: |
          npx wrangler deploy "${{ env.WORKER_FILE }}" --config ${{ env.WRANGLER_CONFIG }}
